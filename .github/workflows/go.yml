name: Build GLVD Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
      with:
        go-version: '1.24'

    - name: Build
      run: make build-linux

    - name: Test
      run: make test

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: glvd-client
        path: |
          glvd-linux-amd64
          glvd-linux-arm64

  run_in_gl:
    runs-on: ubuntu-latest
    container: ghcr.io/gardenlinux/gardenlinux:1877
    needs:
      - build
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
    - run: cat /etc/os-release
    - run: ls -lR
    - run: chmod +x glvd-linux-amd64
    - run: ./glvd-linux-amd64 check
    - run: ./glvd-linux-amd64 what-if frr vim
    - run: ./glvd-linux-amd64 executive-summary
